# Replace this file with a read-only bind mount to use your own upstreams/ACLs.
pool pool.ntp.org iburst

driftfile /var/lib/chrony/drift
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
# Administration uses the local Unix socket, not a network command port.
cmdport 0

# Serve private networks by default. Set the actual client CIDRs for deployment.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
allow fc00::/7
